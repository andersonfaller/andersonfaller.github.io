name: Sync Google Scholar

# Mirrors the Google Scholar profile into data/scholar.json, which the site
# renders in its Research section. Runs twice a week, after changes to the
# sync script, and on demand from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "23 9 * * 1,4"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/sync_scholar.py
      - .github/workflows/scholar-sync.yml

permissions:
  contents: write

concurrency:
  group: scholar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4

      - run: python scripts/sync_scholar.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/scholar.json; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git commit -m "Sync Google Scholar data"
          git push
